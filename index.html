<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meme Engine · @kanyaraasi_memes</title>
    <meta name="description" content="Studio for @kanyaraasi_memes: adapt viral memes in Telugu, check every picture, publish to Instagram." />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F4EB" />
    <script>
      // Night studio: choose light or dark before the first paint, so a dark evening never flashes white. The same rule
      // lives in src/theme/ThemeProvider.jsx (keep them alike): "auto" = dark from 19:00 to 06:30 on this device's clock.
      (function () {
        try {
          var mode = localStorage.getItem('meme_engine_theme') || 'auto';
          var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) || (mode === 'auto' && (h >= 19 || h < 6.5));
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#151412');
        } catch (e) {}
      })();
    </script>
    <!-- The two fonts every screen's first paint uses, fetched together with the code instead of after it: no flash of
         a different font, nothing shifts when they arrive. Everything else (mono, Telugu, meme fonts) loads when used. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2" />
      <script>
      // Ask "who is signed in?" right now, while the app's code is still downloading (it used to wait for it, which
      // put a full round trip in front of the first screen). The app picks the answer up once: see takeEarly in src/api.js.
      try {
        window.__early = { me: fetch('/api/auth/me', { credentials: 'include' }).catch(function () { return null; }) };
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
